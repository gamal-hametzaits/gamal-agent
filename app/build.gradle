plugins {
    id "com.android.application"
    id "kotlin-android"
    id "kotlin-kapt"
}

def lp = new Properties()
def lf = rootProject.file("local.properties")
if (lf.exists()) { lp.load(new FileInputStream(lf)) }

android {
    namespace "dev.hametzaits.gamal"
    compileSdk 33

    defaultConfig {
        applicationId "dev.hametzaits.gamal"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "0.1.0"
    }

    signingConfigs {
        release {
            def sf = lp.getProperty("gamal.storeFile", "")
            if (sf && file(sf).exists()) {
                storeFile file(sf)
                storePassword lp.getProperty("gamal.storePassword", "")
                keyAlias lp.getProperty("gamal.keyAlias", "gamal")
                keyPassword lp.getProperty("gamal.keyPassword", "")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            def sf = lp.getProperty("gamal.storeFile", "")
            if (sf && file(sf).exists()) { signingConfig signingConfigs.release }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions { jvmTarget = "11" }
}

dependencies {
    implementation "androidx.core:core-ktx:1.9.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.9.0"
    implementation "androidx.recyclerview:recyclerview:1.3.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"
    implementation "androidx.room:room-runtime:2.5.2"
    implementation "androidx.room:room-ktx:2.5.2"
    kapt "androidx.room:room-compiler:2.5.2"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.5.1"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4"
}
